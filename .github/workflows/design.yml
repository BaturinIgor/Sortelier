name: Design screens

# Макеты всех экранов, окон и состояний (design/<версия>/screens) на iPhone 6.9" с тестовым
# прогрессом (-uiDemo). Список кадров: tools/design_shots.txt. Игра в одной теме.
# PNG лежат в артефакте design-screens и коммитятся в ветку в design/<версия>/screens.

on:
  workflow_dispatch:
  push:
    branches:
      - "design/**"
  pull_request:
    paths:
      - tools/design_shots.txt
      - .github/workflows/design.yml

permissions:
  contents: write

concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Boot a 6.9-inch iPhone
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          phones = [x for k, v in d.items() if 'iOS' in k for x in v if 'Pro Max' in x['name']]
          phones.sort(key=lambda x: x['name'])
          print(phones[-1]['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project Sortelier.xcodeproj -scheme Sortelier -configuration Debug \
            -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:|fatal error" build.log | sort -u | head -80; tail -30 build.log; exit 1; }

      - name: Take design screenshots
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Sortelier.app
          mkdir -p design-screens
          grep -v '^#' tools/design_shots.txt | while read -r name args; do
            [ -n "$name" ] || continue
            xcrun simctl terminate "$UDID" com.personal.sortelier >/dev/null 2>&1 || true
            # shellcheck disable=SC2086
            xcrun simctl launch "$UDID" com.personal.sortelier -uiDemo $args >/dev/null
            sleep 7
            xcrun simctl io "$UDID" screenshot "design-screens/$name.png" >/dev/null 2>&1
            pgrep -f "Sortelier.app/Sortelier" >/dev/null || echo "$name: app not running" | tee -a design-screens/report.txt
          done
          [ -f design-screens/report.txt ] || echo "all screens shown" > design-screens/report.txt
          cat design-screens/report.txt >> "$GITHUB_STEP_SUMMARY"
          ls design-screens | wc -l

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-screens
          path: design-screens
          if-no-files-found: ignore

      - name: Commit screenshots to design/<version>/screens
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed 's/.*: *//; s/"//g')
          DEST="design/$VERSION/screens"
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp design-screens/*.png design-screens/report.txt "$DEST"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Design screens $VERSION: $(ls "$DEST"/*.png | wc -l | tr -d ' ') screenshots"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
