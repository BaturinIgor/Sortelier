name: App Store availability

# Проверка доступности приложения по территориям; fix=true возвращает его в продажу.
on:
  workflow_dispatch:
    inputs:
      fix:
        description: "Вернуть в продажу"
        type: boolean
        default: false
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/availability.yml"
      - "tools/appstore/availability.py"

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install -q "pyjwt[crypto]"
          python3 tools/appstore/availability.py ${{ inputs.fix && '--fix' || '' }}
