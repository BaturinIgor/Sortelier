name: Sortelier
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Sortelier:
    type: application
    platform: iOS
    sources:
      - path: Sortelier
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    info:
      path: Sortelier/Info.plist
      properties:
        CFBundleDisplayName: Sortelier
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ru, es, pt-BR, de, fr, it, tr, pl, id, vi, th, hi, ar, ja, ko, zh-Hans, zh-Hant]
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [Nunito-Bold.ttf, Nunito-ExtraBold.ttf, Nunito-Black.ttf]
        AppMetricaAPIKey: ""
        # AdMob, приложение Sortelier. В отладке и сборке для SideStore код берет тестовый блок Google (Ads.unitId).
        GADApplicationIdentifier: ca-app-pub-9867750696429328~4506031184
        AdMobRewardedUnit: ca-app-pub-9867750696429328/4907541770
        NSUserTrackingUsageDescription: "Your data will be used to show you more relevant ads."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
